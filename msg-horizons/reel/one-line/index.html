<!doctype html>
<!--
  MSG Horizons, 15 s showreel: "One Line".
  One blue point is drawn into everything: it splits the screen, writes the type, folds into the MSG hexagon, rises
  into a 3D district, reads as live data, becomes the Kingdom's network, and closes back into the point. The last
  frame is the first, so it loops.

  120 BPM, a beat every 0.5 s, 30 beats, one technique per bar. Every pixel is computed from time inside
  window.seek(t): no CSS animation, no timers, no state carried between frames. Palette: navy #1C2C51, blue #009DF8,
  sand #F2B45A, black, white. One typeface (Funnel Sans Bold, the brand's English face). One camera: a single
  perspective camera (focal length 1400 px) that looks straight down on the 2D scenes, so they are the ground plane
  seen from above, and tilts, orbits and dollies on exponential moves, always on the beat.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Funnel"; src: url("fonts/FunnelSans-Bold.woff2") format("woff2"); font-weight: 700; font-display: block; }
  html, body { margin: 0; background: #000; }
  #stage { width: 1920px; height: 1080px; overflow: hidden; display: block; background: #000; }
  text { font-family: "Funnel"; font-weight: 700; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
<script src="ksa.js"></script>
<script src="audio.js"></script>
<script>
(() => {
const NAVY = "#1C2C51", BLUE = "#009DF8", SAND = "#F2B45A", WHITE = "#FFFFFF", BLACK = "#000000";
const W = 1920, H = 1080, CX = 960, CY = 540, F = 1400, DEG = Math.PI / 180, TAU = Math.PI * 2, SQ3 = Math.sqrt(3);
const svg = document.getElementById("stage");

/* ---------- time: every easing is a function of time ---------- */
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const expoOut = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
const expoIn = (u) => (u <= 0 ? 0 : Math.pow(2, 10 * (u - 1)) - 0.001 * (1 - u));
const expoInOut = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2);
/** critically damped spring from 0 to 1 released at t0: it settles without overshoot, so it never bounces */
const spring = (t, t0, w = 16) => { const x = Math.max(0, t - t0); return 1 - (1 + w * x) * Math.exp(-w * x); };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const lp2 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
const lp3 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
const lpa = (A, B, u) => A.map((p, i) => lp2(p, B[i], u));
const DT = 1 / 180; // one subframe: blur is sized from how far a thing moved in it

/* ---------- colour ---------- */
const RGB = {};
const rgb = (h) => RGB[h] || (RGB[h] = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)));
const mixc = (a, b, u) => { const A = typeof a === "string" ? rgb(a) : a, B = typeof b === "string" ? rgb(b) : b; return [lerp(A[0], B[0], u), lerp(A[1], B[1], u), lerp(A[2], B[2], u)]; };
const css = (c) => (typeof c === "string" ? c : `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`);

/* ---------- drawing: the frame is one SVG string ---------- */
let out = [], defs = [], FIL = new Map();
const f1 = (v) => (Math.round(v * 10) / 10).toString();
const P2 = (p) => `${f1(p[0])},${f1(p[1])}`;
const poly = (p, fill, extra = "") => out.push(`<polygon points="${p.map(P2).join(" ")}" fill="${css(fill)}" ${extra}/>`);
const rect = (x, y, w, h, fill, extra = "") => out.push(`<rect x="${f1(x)}" y="${f1(y)}" width="${f1(Math.max(0, w))}" height="${f1(Math.max(0, h))}" fill="${css(fill)}" ${extra}/>`);
const circle = (x, y, r, fill, extra = "") => out.push(`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(Math.max(0, r))}" fill="${css(fill)}" ${extra}/>`);
const pline = (p, stroke, w, extra = "") => p.length > 1 && out.push(`<polyline points="${p.map(P2).join(" ")}" fill="none" stroke="${css(stroke)}" stroke-width="${f1(w)}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`);
const text = (x, y, s, size, fill, extra = "") => out.push(`<text x="${f1(x)}" y="${f1(y)}" font-size="${size}" fill="${css(fill)}" ${extra}>${s}</text>`);
let clipN = 0;
const clipRect = (x, y, w, h) => { const id = `c${clipN++}`; defs.push(`<clipPath id="${id}"><rect x="${f1(x)}" y="${f1(y)}" width="${f1(Math.max(0, w))}" height="${f1(Math.max(0, h))}"/></clipPath>`); return `clip-path="url(#${id})"`; };
/** a directional blur, quantised so a frame reuses a handful of filters */
const blur = (sx, sy) => {
  sx = Math.min(28, Math.abs(sx)); sy = Math.min(28, Math.abs(sy));
  if (sx < 0.5 && sy < 0.5) return "";
  const qx = Math.round(sx * 2) / 2, qy = Math.round(sy * 2) / 2, id = `b${qx * 2}_${qy * 2}`;
  if (!FIL.has(id)) FIL.set(id, `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="${qx} ${qy}"/></filter>`);
  return `filter="url(#${id})"`;
};
/** blur that follows speed and direction: fn(t) gives a position, sampled one subframe apart */
const mblur = (fn, t, k = 0.55) => { const a = fn(t), b = fn(t - DT); return blur((a[0] - b[0]) * k, (a[1] - b[1]) * k); };

/* ---------- the camera: one perspective camera for the whole reel ---------- */
function camera(T, yaw, pitch, D) {
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
  const C = [T[0] - D * sy * cp, T[1] + D * sp, T[2] - D * cy * cp];
  const f = [sy * cp, -sp, cy * cp], r = [cy, 0, -sy];
  const u = [f[1] * r[2] - f[2] * r[1], f[2] * r[0] - f[0] * r[2], f[0] * r[1] - f[1] * r[0]];
  const depth = (p) => (p[0] - C[0]) * f[0] + (p[1] - C[1]) * f[1] + (p[2] - C[2]) * f[2];
  const P = (p) => {
    const d0 = p[0] - C[0], d1 = p[1] - C[1], d2 = p[2] - C[2];
    const z = d0 * f[0] + d1 * f[1] + d2 * f[2];
    return [CX + (F * (d0 * r[0] + d1 * r[1] + d2 * r[2])) / z, CY - (F * (d0 * u[0] + d1 * u[1] + d2 * u[2])) / z, z];
  };
  return { C, f, P, depth };
}
// looking straight down from F away, the ground plane (x, 0, z) lands on the screen 1:1 at (CX + x, CY - z)
const LIGHT = (() => { const l = [0.32, 0.62, -0.72], n = Math.hypot(...l); return l.map((v) => v / n); })();
const lambert = (n) => Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
const facing = (cam, p, n) => (p[0] - cam.C[0]) * n[0] + (p[1] - cam.C[1]) * n[1] + (p[2] - cam.C[2]) * n[2] < 0;

/* ---------- the MSG mark, from the brand vector (centred on the hexagon) ---------- */
const HEX = [[-36.67, 0.06], [-18.46, -31.6], [18.36, -31.66], [36.67, -0.06], [18.46, 31.59], [-18.36, 31.66]];
const PA = [[4.69, -0.01], [-18.46, -31.6], [-36.67, 0.06], [-18.36, 31.66]];
const PB = [[-7.23, 31.63], [18.46, 31.59], [36.67, -0.06]];
const PC = [[-7.34, -31.63], [36.67, -0.06], [18.36, -31.66]];
const CHEV = [[-7.34, -31.63], [18.36, -31.66], [36.67, -0.06], [18.46, 31.59], [-7.23, 31.63], [36.67, -0.06]];
const GAP = [[-18.46, -31.6], [-7.34, -31.63], [36.67, -0.06], [-7.23, 31.63], [-18.36, 31.66], [4.69, 0]];
const m1 = [-12.9, -31.6], m3 = [20.68, -0.03], m2 = [-12.8, 31.645];
const GAP0 = [m1, m1, m3, m2, m2, m3]; // the cut before it opens: a line down the middle of the gap
const place = (shape, s, x = CX, y = CY) => shape.map((p) => [x + p[0] * s, y + p[1] * s]);
const MK = 5;  // the mark in bar 3
const SL = 2.4; // the mark in the end title

/* ---------- the hex district ---------- */
const R = 40, RD = 35;
const H7 = [150, 205, 185, 255, 235, 320, 395]; // the seven blue cells: towers, then the bars of the chart
const CELLS = [], CELL = {};
for (let c = -24; c <= 24; c++) for (let r = -17; r <= 17; r++) {
  const x = c * 1.5 * R, z = (r + (Math.abs(c) % 2 ? 0.5 : 0)) * SQ3 * R, d = Math.hypot(x, z);
  if (d > 1190) continue;
  const blue = r === 0 && c % 2 === 0 && Math.abs(c) <= 6 ? c / 2 + 3 : -1;
  const n1 = hash(c * 31.7 + r * 7.3), n2 = hash(c * 3.1 - r * 17.9 + 5);
  const h = blue < 0 && n1 > 0.4 ? (24 + 150 * Math.pow(n2, 1.5)) * (1 - 0.6 * d / 1190) : 0;
  const cell = { c, r, x, z, d, blue, h, route: -1 };
  CELLS.push(cell); CELL[`${c},${r}`] = cell;
}
// a street through the district: adjacent cells, following a gentle curve below the blue row
{
  const zt = (c) => (-3.3 + 1.9 * Math.sin(c * 0.24 + 0.5)) * SQ3 * R;
  const route = [];
  let cur = null;
  for (let c = -20; c <= 20; c++) {
    const col = CELLS.filter((k) => k.c === c && (!cur || Math.abs(k.z - cur.z) < SQ3 * R * 0.6));
    if (!col.length) continue;
    cur = col.reduce((a, b) => (Math.abs(b.z - zt(c)) < Math.abs(a.z - zt(c)) ? b : a));
    route.push(cur);
  }
  route.forEach((k, j) => { k.route = j / (route.length - 1); k.h = 0; });
}
const BLUECELLS = CELLS.filter((k) => k.blue >= 0).sort((a, b) => a.blue - b.blue);
const hexV = (x, z, rr) => [0, 1, 2, 3, 4, 5].map((k) => [x + rr * Math.cos(k * 60 * DEG), z + rr * Math.sin(k * 60 * DEG)]);
const SIDE_N = [0, 1, 2, 3, 4, 5].map((k) => [Math.cos((k * 60 + 30) * DEG), 0, Math.sin((k * 60 + 30) * DEG)]);
/** a hex cell on screen in 2D, vertex order matching CHEV (Cl, Cr, Tip, Br, Bl, Tip) */
const hexMorph = (x, y, rr) => [240, 300, 0, 60, 120, 180].map((a) => [x + rr * Math.cos(a * DEG), y + rr * Math.sin(a * DEG)]);

/* ---------- the Kingdom: dots, outline and six routes from Riyadh ---------- */
const MW = (p) => [p[0] - 500, 0, 400 - p[1]]; // map point (1000 x 820 frame) to the ground plane
const RIY = [575.8, 387.2], RW = MW(RIY);
const CITIES = [["TABUK", [98, 196]], ["MADINAH", [242, 399]], ["JEDDAH", [221, 551]], ["HAIL", [339.8, 240.3]], ["SABYA", [384, 778]], ["DAMMAM", [737, 297]]];
const DOTS = window.KSA_DOTS.map((p, i) => ({ w: MW(p), mx: p[0], dr: Math.hypot(p[0] - RIY[0], p[1] - RIY[1]), bar: i % 7, hx: 0.12 + 0.76 * hash(i * 1.37), hy: 0.08 + 0.84 * hash(i * 2.11 + 9), j: hash(i * 5.3) }));
const DRMAX = Math.max(...DOTS.map((d) => d.dr));
const OUTLINE = window.KSA_OUTLINE.map(MW);
const NR = 40;
const ROUTES = CITIES.map(([name, p]) => {
  const dx = p[0] - RIY[0], dy = p[1] - RIY[1], len = Math.hypot(dx, dy);
  const ctl = [(RIY[0] + p[0]) / 2 - (dy / len) * 0.2 * len, (RIY[1] + p[1]) / 2 + (dx / len) * 0.2 * len];
  const g = [];
  for (let k = 0; k < NR; k++) {
    const s = k / (NR - 1), a = (1 - s) * (1 - s), b = 2 * s * (1 - s), c = s * s;
    g.push(MW([a * RIY[0] + b * ctl[0] + c * p[0], a * RIY[1] + b * ctl[1] + c * p[1]]));
  }
  return { name, p, len, g, ang: Math.atan2(-dy, dx) };
});
// each route sweeps into the hexagon edge that faces the same way
{
  const em = HEX.map((v, k) => { const w = HEX[(k + 1) % 6]; return Math.atan2(-(v[1] + w[1]) / 2, (v[0] + w[0]) / 2); });
  const ri = ROUTES.map((_, i) => i).sort((a, b) => ((ROUTES[a].ang + TAU) % TAU) - ((ROUTES[b].ang + TAU) % TAU));
  const ei = em.map((_, i) => i).sort((a, b) => ((em[a] + TAU) % TAU) - ((em[b] + TAU) % TAU));
  let best = 0, bc = Infinity;
  for (let o = 0; o < 6; o++) {
    let cost = 0;
    ri.forEach((r, k) => { const d = Math.abs(((ROUTES[r].ang - em[ei[(k + o) % 6]]) + 3 * Math.PI) % TAU - Math.PI); cost += d; });
    if (cost < bc) { bc = cost; best = o; }
  }
  ri.forEach((r, k) => (ROUTES[r].edge = ei[(k + best) % 6]));
}
const MK3 = 6, YM = 300, ZF = RW[2] - 30; // the 3D mark: scale, height, and its front plane
const hexW = (k, s = MK3) => [RW[0] + s * HEX[k % 6][0], YM - s * HEX[k % 6][1], ZF];

/* ---------- type ---------- */
const FS = 300, PR = 21;
let CAP = 214, BASE = CY + 107, ROLL = FS;
const LAY = {};
let measureCtx = null;
const mtext = (s, size, track = 0) => { measureCtx.font = `700 ${size}px Funnel`; return measureCtx.measureText(s).width + track * Math.max(0, s.length - 1); };
function layoutWords() {
  measureCtx = document.createElement("canvas").getContext("2d");
  measureCtx.font = `700 ${FS}px Funnel`;
  CAP = measureCtx.measureText("H").actualBoundingBoxAscent;
  BASE = CY + CAP / 2; ROLL = CAP + 70;
  for (const w of ["MOVE", "WHAT", "MATTERS"]) {
    const tr = -0.02 * FS, xs = [];
    let x = 0;
    for (const ch of w) { xs.push(x); x += measureCtx.measureText(ch).width + tr; }
    const width = x - tr, gap = 0.04 * FS, total = width + gap + 2 * PR, left = CX - total / 2;
    LAY[w] = { w, xs: xs.map((v) => left + v), left, width, px: left + width + gap + PR, cx: left + width / 2 };
  }
}
const letter = (ch, x, y, fill, extra = "") => text(x, y, ch, FS, fill, extra);

/* ======================= bar 1 (0-2) the hook, and bar 2 (2-4) kinetic type ======================= */
function sceneType(t) {
  // beat 1: the point moves off centre; beat 2: it shoots across and leaves a white line
  if (t < 1.0) {
    if (t < 0.5) {
      const xf = (s) => [lerp(CX, 250, expoInOut(seg(s, 0.04, 0.46))), CY];
      const p = xf(t);
      circle(p[0], p[1], 12, BLUE, mblur(xf, t));
    } else {
      const Lf = (s) => lerp(250, -40, expoOut(seg(s, 0.5, 0.92)));
      const Rf = (s) => lerp(250, W + 80, expoOut(seg(s, 0.5, 0.86)));
      rect(Lf(t), CY - 1.5, Rf(t) - Lf(t), 3, WHITE);
      const xf = (s) => [Rf(s), CY];
      circle(Rf(t), CY, 12, BLUE, mblur(xf, t));
    }
    return;
  }
  // the type: MOVE rises in the seam, rolls to WHAT, rolls to MATTERS
  if (t < 3.0) {
    const band = clipRect(0, BASE - CAP - 36, W, CAP + 72);
    const drawLetters = (lay, dy, fill = WHITE) => lay.w.split("").forEach((ch, k) => {
      const y = BASE + dy(k, t);
      if (Math.abs(y - BASE) > ROLL - 1) return;
      const b = blur(0, (dy(k, t) - dy(k, t - DT)) * 0.5);
      letter(ch, lay.xs[k], y, fill, b);
    });
    out.push(`<g ${band}>`);
    if (t < 2.0) {
      drawLetters(LAY.MOVE, (k, s) => ROLL * (1 - expoOut(seg(s, 1.06 + 0.04 * k, 1.5 + 0.04 * k))));
    } else {
      const [A, B, t0] = t < 2.5 ? [LAY.MOVE, LAY.WHAT, 2.0] : [LAY.WHAT, LAY.MATTERS, 2.5];
      const p = (k, s) => expoInOut(seg(s, t0 + 0.025 * k, t0 + 0.025 * k + 0.3));
      drawLetters(A, (k, s) => -ROLL * p(k, s));
      drawLetters(B, (k, s) => ROLL * (1 - p(k, s)));
    }
    out.push("</g>");
  } else {
    // bar 2, beat 3: MATTERS stacks into seven rows; beat 4: the rows crush into a white square
    const L = LAY.MATTERS, P = CAP + 34;
    const off = (k, s) => k * P * expoOut(seg(s, 3.0 + 0.03 * Math.abs(k), 3.42 + 0.03 * Math.abs(k))) - 64 * expoOut(seg(s, 3.0, 3.6));
    const u = (s) => expoInOut(seg(s, 3.5, 3.86));
    const SQ = 300, rowH = SQ / 7;
    const cy0 = BASE - CAP / 2;
    const fill = expoOut(seg(t, 3.66, 3.92));
    if (t >= 3.92) rect(CX - SQ / 2, CY - SQ / 2, SQ, SQ, WHITE);
    else for (let k = -3; k <= 3; k++) {
      const yc = (s) => lerp(cy0 + off(k, Math.min(s, 3.5)), CY + k * rowH, u(s));
      const sx = lerp(1, SQ / L.width, u(t)), sy = lerp(1, rowH / CAP, u(t)), xc = lerp(L.cx, CX, u(t));
      const outline = Math.abs(k) % 2 === 1;
      const b = blur(0, (yc(t) - yc(t - DT)) * 0.5);
      out.push(`<g ${b}><g transform="translate(${f1(xc)} ${f1(yc(t))}) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(${f1(-L.cx)} ${f1(-cy0)})">`);
      L.w.split("").forEach((ch, i) => letter(ch, L.xs[i], BASE, outline ? "none" : WHITE, outline ? `stroke="${BLUE}" stroke-width="3" vector-effect="non-scaling-stroke"` : ""));
      out.push("</g>");
      if (fill > 0) rect(xc - (L.width * sx) / 2 - 0.5, yc(t) - (CAP * sy * fill) / 2 - 0.5, L.width * sx + 1, CAP * sy * fill + 1, WHITE);
      out.push("</g>");
    }
  }
  // bar 1, beat 3: the line becomes a seam and the black splits open onto navy; beat 4: the halves leave
  if (t < 1.95) {
    const gf = (s) => 440 * expoInOut(seg(s, 1.0, 1.42)) + 760 * expoInOut(seg(s, 1.5, 1.92));
    const g = gf(t), b = blur(0, (gf(t) - gf(t - DT)) * 0.25);
    out.push(`<g ${b}>`);
    rect(0, -10, W, CY - g / 2 + 10, BLACK); rect(0, CY + g / 2, W, H, BLACK);
    rect(0, CY - g / 2 - 1.5, W, 3, WHITE); rect(0, CY + g / 2 - 1.5, W, 3, WHITE);
    out.push("</g>");
  }
  // the point flies back in as MOVE's full stop, and rides the end of each word
  if (t >= 1.5 && t < 3.3) {
    const pf = (s) => {
      if (s < 2.0) { const e = expoOut(seg(s, 1.5, 1.86)); return [lerp(W + 40, LAY.MOVE.px, e), lerp(CY, BASE - PR, e), lerp(12, PR, e)]; }
      const e1 = expoInOut(seg(s, 2.0, 2.36)), e2 = expoInOut(seg(s, 2.5, 2.86));
      return [lerp(lerp(LAY.MOVE.px, LAY.WHAT.px, e1), LAY.MATTERS.px, e2) - 64 * expoOut(seg(s, 3.0, 3.6)), BASE - PR - 64 * expoOut(seg(s, 3.0, 3.6)), PR * (1 - expoIn(seg(s, 3.0, 3.28)))];
    };
    const p = pf(t);
    circle(p[0], p[1], p[2], BLUE, mblur(pf, t));
  }
}

/* ======================= bar 3 (4-6) shape morphing ======================= */
function ray(poly, th) {
  const dx = Math.cos(th), dy = Math.sin(th);
  let best = Infinity;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], ex = b[0] - a[0], ey = b[1] - a[1], den = dx * ey - dy * ex;
    if (Math.abs(den) < 1e-9) continue;
    const tt = (a[0] * ey - a[1] * ex) / den, s = (a[0] * dy - a[1] * dx) / den;
    if (s >= -1e-6 && s <= 1 + 1e-6 && tt > 0) best = Math.min(best, tt);
  }
  return [dx * best, dy * best];
}
const SQUARE = [[150, -150], [150, 150], [-150, 150], [-150, -150]];
const HEXMK = HEX.map((p) => [p[0] * MK, p[1] * MK]);
function sceneMark(t) {
  if (t < 4.5) {
    // beat 1: the square turns a quarter and becomes the hexagon
    const u = expoInOut(seg(t, 4.0, 4.42)), rot = (1 - u) * Math.PI / 2, N = 96, pts = [];
    for (let i = 0; i < N; i++) {
      const th = (TAU * i) / N, s = ray(SQUARE, th), h = ray(HEXMK, th);
      const sr = [s[0] * Math.cos(rot) - s[1] * Math.sin(rot), s[0] * Math.sin(rot) + s[1] * Math.cos(rot)];
      pts.push([CX + lerp(sr[0], h[0], u), CY + lerp(sr[1], h[1], u)]);
    }
    poly(pts, WHITE);
  } else if (t < 5.0) {
    // beat 2: the hexagon is cut into the mark, and the arrow takes the blue from its tip
    const u = expoInOut(seg(t, 4.5, 4.84));
    poly(place(HEX, MK), WHITE);
    poly(place(lpa(GAP0, GAP, u), MK), NAVY);

  const mx = mxf(t)[0], edge = mx + 36.67 * SL + 14;
  // beat 1 (14 s): the name slides out from behind the mark; beat 2 (14.5 s): it slides back in
  const slide = (s, d) => -(Lk.gw + 80) * (1 - expoOut(seg(s, 14.03 + d, 14.38 + d))) - (Lk.gw + 120) * expoIn(seg(s, 14.5 + d * 0.5, 14.76 + d * 0.5));
  if (t < 14.78) {
    const c = clipRect(edge, 0, W, H);
    const tf = (s) => [Lk.tx + slide(s, 0), 0], gf = (s) => [Lk.tx + 2 + slide(s, 0.05), 0];
    out.push(`<g ${c}>`);
    out.push(`<g ${mblur(tf, t, 0.4)}>`); text(tf(t)[0], CY + 10, "MSG Horizons", 104, WHITE, `letter-spacing="-1.5"`); out.push("</g>");
    out.push(`<g ${mblur(gf, t, 0.4)}>`); text(gf(t)[0], CY + 56, "INTEGRATED LOGISTICS · KINGDOM OF SAUDI ARABIA", 18, WHITE, `fill-opacity="0.72" letter-spacing="5.6"`); out.push("</g>");
    out.push("</g>");
  }
  const m = expoInOut(seg(t, 14.6, 14.95)), b = mblur(mxf, t, 0.4);
  out.push(`<g ${b}>`);
  const A = toCircle(place(PA, SL, mx), CX, CY, 10.5), Cv = toCircle(place(CHEV, SL, mx), CX, CY, 12);
  poly(m > 0 ? lpa(A.pts, A.circ, m) : place(PA, SL, mx), WHITE);
  poly(m > 0 ? lpa(Cv.pts, Cv.circ, m) : place(CHEV, SL, mx), BLUE);
  out.push("</g>");
}

/* ======================= the frame ======================= */
function seek(t) {
  t = clamp(t, 0, 15);
  out = []; defs = []; FIL = new Map(); clipN = 0;
  rect(0, 0, W, H, BLACK);
  // the navy ground: open from the seam at 1 s, taken away by the chevron wipe at 13.5 s
  if (t >= 1.0 && t < 13.98) {
    if (t < 13.5) rect(0, 0, W, H, NAVY);
    else {
      const wf = (s) => [lerp(W + 330, -330, expoInOut(seg(s, 13.5, 13.98))), 0], x = wf(t)[0];
      poly([[-40, -40], [x, -40], [x - 300, CY], [x, H + 40], [-40, H + 40]], NAVY, mblur(wf, t, 0.35));
    }
  }
  if (t < 4.0) sceneType(t);
  else if (t < 5.5) sceneMark(t);
  else if (t < 8.0) sceneCity(t);
  if (t >= 8.0 && t < 10.4) sceneData(t);
  if (t >= 10.0 && t < 14.0) sceneMap(t);
  if (t >= 14.0) sceneEnd(t);
  svg.innerHTML = `<defs>${[...FIL.values()].join("")}${defs.join("")}</defs>${out.join("")}`;
}

window.seek = seek;
window.ready = (async () => {
  await document.fonts.load('700 100px "Funnel"');
  await document.fonts.ready;
  layoutWords();
  barRects();
  seek(0);
})();
})();
</script>
